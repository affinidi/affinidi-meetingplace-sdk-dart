name: Pull Request Checks

on: 
  pull_request:
     
jobs:
  minimumSDK:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: '3.10.0'
      - run: dart pub get
      - run: dart analyze

  dart-pipeline:
    uses: affinidi/pipeline-dart/.github/workflows/check.yaml@main
    secrets: inherit
    with:
      flutter-version: '3.41.9'
      package: true
      pana_min_score: 160
      env_vars: |
        MEDIATOR_DID=${{ vars.MEDIATOR_DID }}
        MEDIATOR_DID_ALTERNATIVE=${{ vars.MEDIATOR_DID_ALTERNATIVE }}
        CONTROL_PLANE_DID=${{ vars.MATRIX_CONTROL_PLANE_DID }}
        MATRIX_HOMESERVER=${{ vars.MATRIX_HOMESERVER }}
