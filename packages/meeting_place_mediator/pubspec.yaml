name: meeting_place_mediator

description: Mediator SDK is a package for securely connecting and authenticating with DIDComm mediators to send and receive messages, including out-of-band invitations.
repository: https://github.com/affinidi/affinidi-meetingplace-sdk-dart.git
version: 0.0.1-dev.16
resolution: workspace

environment:
  sdk: ^3.10.0

dependencies:
  crypto: ^3.0.6
  didcomm: ^2.3.3
  dio: ^5.9.0
  json_annotation: ^4.9.0
  mutex: ^3.1.0
  retry: ^3.1.2
  ssi: ^3.9.4
  uuid: ^4.5.1

dev_dependencies:
  build_runner: ^2.5.4
  dart_flutter_team_lints: ^3.5.2
  dotenv: ^4.2.0
  json_serializable: ^6.9.5
  mocktail: ^1.0.4
  test: ^1.26.3
